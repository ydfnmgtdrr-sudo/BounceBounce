<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sprungkraft Blueprint</title>
<meta name="theme-color" content="#0c0d11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sprungkraft">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230c0d11'/%3E%3Ctext x='90' y='124' font-size='96' text-anchor='middle'%3E%F0%9F%8F%90%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0d11; --bg2:#101218; --surface:#16181f; --surface2:#1c1f28;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#f3f4f7; --muted:#9aa1ad; --faint:#6b7280;
  --accent:#ff7a1a; --accent-soft:rgba(255,122,26,.14);
  --good:#34d399; --bad:#f87171;
  --m1:#34d399; --m2:#22d3ee; --m3:#60a5fa; --m4:#a78bfa; --m5:#fb923c; --m6:#fb5e7a;
  --f-disp:'Anton',Impact,'Arial Narrow',sans-serif;
  --f-cond:'Barlow Condensed',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
  --shadow:0 12px 34px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--f-body); color:var(--text); background:var(--bg);
  background-image:
    radial-gradient(1200px 540px at 85% -8%, rgba(255,122,26,.13), transparent 60%),
    radial-gradient(900px 480px at -10% 8%, rgba(96,165,250,.10), transparent 55%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased; line-height:1.5; letter-spacing:.005em;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.04;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
#app{position:relative;z-index:1;max-width:468px;margin:0 auto;min-height:100vh;
  display:flex;flex-direction:column;
  border-left:1px solid var(--line);border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.012),transparent 240px);}

/* App bar */
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:11px;
  padding:14px 18px 13px;backdrop-filter:blur(16px);
  background:linear-gradient(180deg,rgba(12,13,17,.92),rgba(12,13,17,.66));
  border-bottom:1px solid var(--line);}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;
  background:radial-gradient(circle at 30% 25%,#ffb066,var(--accent));
  box-shadow:0 6px 16px rgba(255,122,26,.4), inset 0 1px 0 rgba(255,255,255,.35);}
.brand h1{font-family:var(--f-disp);font-size:21px;letter-spacing:.045em;line-height:.95;margin:0;
  text-transform:uppercase;}
.brand p{margin:1px 0 0;font-size:10.5px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.appbar .wk{margin-left:auto;text-align:right}
.appbar .wk b{font-family:var(--f-disp);font-size:18px;letter-spacing:.03em;display:block;line-height:1}
.appbar .wk span{font-size:9.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:700}

main{flex:1;padding:18px 16px 104px;animation:fade .34s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

/* Bottom nav */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:40;width:100%;max-width:468px;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:linear-gradient(180deg,rgba(16,18,24,.82),rgba(10,11,15,.96));
  backdrop-filter:blur(18px);border-top:1px solid var(--line2);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;cursor:pointer;
  color:var(--faint);font-family:var(--f-body);font-size:9.5px;font-weight:700;letter-spacing:.05em;
  padding:5px 2px;border-radius:12px;transition:color .18s,transform .12s;text-transform:uppercase}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--accent)}
.tab.active svg{filter:drop-shadow(0 0 7px rgba(255,122,26,.6))}
.tab:active{transform:scale(.9)}

/* Generic */
.section-eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0 2px 9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.stagger>*{animation:fade .4s ease both}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.07s}
.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.17s}
.stagger>*:nth-child(5){animation-delay:.22s}.stagger>*:nth-child(6){animation-delay:.27s}
.stagger>*:nth-child(7){animation-delay:.32s}.stagger>*:nth-child(n+8){animation-delay:.36s}

/* HERO (home) */
.hero{position:relative;border-radius:22px;padding:22px 20px 20px;margin-bottom:18px;overflow:hidden;
  background:
    radial-gradient(420px 200px at 90% -10%,rgba(255,122,26,.32),transparent 60%),
    linear-gradient(160deg,#1a1d27,#121319);
  border:1px solid var(--line2);box-shadow:var(--shadow)}
.hero .court{position:absolute;right:-30px;top:-26px;font-size:128px;opacity:.06;transform:rotate(-12deg)}
.hero h2{font-family:var(--f-disp);font-size:30px;line-height:.92;letter-spacing:.02em;margin:0;text-transform:uppercase}
.hero .sub{color:#ffcf9f;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-top:8px}
.hero .meta{display:flex;gap:18px;margin-top:16px}
.hero .meta .v{font-family:var(--f-disp);font-size:26px;line-height:1;letter-spacing:.02em}
.hero .meta .k{font-size:9.5px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase;font-weight:700;margin-top:3px}

.timeline{display:flex;gap:5px;margin-top:18px}
.timeline .seg{flex:1;height:8px;border-radius:6px;opacity:.55;transition:.2s}
.timeline .seg.on{opacity:1;box-shadow:0 0 12px -1px currentColor;height:11px}
.tl-labels{display:flex;justify-content:space-between;margin-top:6px;font-size:9px;color:var(--faint);font-weight:700;letter-spacing:.04em}

.statgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-bottom:18px}
.stat{padding:15px 14px;text-align:left}
.stat .v{font-family:var(--f-disp);font-size:27px;line-height:.95;letter-spacing:.02em}
.stat .v small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:700;letter-spacing:0}
.stat .k{font-size:9.5px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-top:6px}
.stat .accent{color:var(--accent)}

.block-card{padding:17px 17px 16px;margin-bottom:14px;position:relative}
.block-card .tag{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-disp);font-size:13px;letter-spacing:.05em;
  padding:5px 11px;border-radius:9px;color:#0c0d11;margin-bottom:11px}
.block-card h3{margin:0;font-size:17px;font-weight:800;letter-spacing:.01em}
.block-card .ph{color:var(--muted);font-size:12.5px;margin-top:5px}
.dateline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
input[type=date],input[type=number],input[type=text]{
  font-family:var(--f-body);background:var(--surface2);border:1px solid var(--line2);color:var(--text);
  border-radius:10px;padding:9px 11px;font-size:13.5px;outline:none;transition:border .15s,box-shadow .15s;width:100%}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder{color:var(--faint)}
.btn{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.07em;font-weight:700;font-size:15px;
  border:0;border-radius:12px;padding:12px 16px;cursor:pointer;transition:transform .12s,filter .15s;
  background:linear-gradient(135deg,#ffa45e,var(--accent));color:#1a0e03;width:100%;
  box-shadow:0 8px 20px rgba(255,122,26,.35)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line2);box-shadow:none}

/* Mesocycle list */
.meso-card{padding:0;margin-bottom:13px;cursor:pointer;display:block;width:100%;text-align:left;border:1px solid var(--line);
  background:var(--surface);transition:transform .14s,border-color .2s}
.meso-card:active{transform:scale(.985)}
.meso-card .bar{height:5px;width:100%}
.meso-card .body{padding:15px 16px 15px;display:flex;gap:14px;align-items:flex-start}
.meso-badge{font-family:var(--f-disp);font-size:22px;letter-spacing:.02em;width:52px;height:52px;border-radius:13px;
  display:grid;place-items:center;flex:none;color:#0c0d11}
.meso-card h3{margin:0;font-size:15.5px;font-weight:800;letter-spacing:.01em}
.meso-card .wk{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.meso-card .desc{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.45}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:7px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
.intens{margin-left:auto;text-align:right;flex:none}
.intens .v{font-family:var(--f-disp);font-size:15px;letter-spacing:.02em;color:var(--text)}
.intens .k{font-size:8.5px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;font-weight:700}

/* Meso detail */
.detail-head{position:relative;border-radius:20px;padding:18px 18px 17px;margin-bottom:15px;overflow:hidden;
  border:1px solid var(--line2);box-shadow:var(--shadow)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);cursor:pointer;
  font-weight:700;font-size:12.5px;letter-spacing:.04em;padding:0;margin-bottom:13px}
.back svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.detail-head .code{font-family:var(--f-disp);font-size:34px;line-height:.9;letter-spacing:.02em}
.detail-head h2{margin:5px 0 0;font-size:16px;font-weight:800}
.detail-head .wk{font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-top:7px}
.keynote{margin-top:12px;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line);
  font-size:12px;color:var(--text);line-height:1.5}
.keynote b{color:var(--accent2,inherit)}

.segctl{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:5px;margin-bottom:13px}
.segctl button{flex:1;border:0;background:none;cursor:pointer;color:var(--muted);font-family:var(--f-cond);font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;font-size:14px;padding:9px 4px;border-radius:9px;transition:.16s}
.segctl button.on{color:#0c0d11;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.weekctl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:15px}
.weekctl button{border:1px solid var(--line);background:var(--surface);cursor:pointer;border-radius:12px;padding:9px 4px;
  color:var(--muted);font-weight:800;font-size:13px;letter-spacing:.04em;transition:.16s;position:relative}
.weekctl button small{display:block;font-size:8.5px;letter-spacing:.1em;font-weight:700;margin-top:2px;color:var(--faint)}
.weekctl button.on{color:#0c0d11}
.weekctl button.on small{color:rgba(0,0,0,.6)}

.prog{display:flex;align-items:center;gap:11px;margin-bottom:14px;padding:0 2px}
.prog .track{flex:1;height:8px;border-radius:6px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.prog .fill{height:100%;border-radius:6px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.prog .lbl{font-family:var(--f-disp);font-size:14px;letter-spacing:.02em;min-width:46px;text-align:right}

.daytitle{font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:15px;
  color:var(--muted);margin:0 2px 11px;display:flex;align-items:center;gap:8px}

/* Exercise card */
.ex{padding:14px 15px 13px;margin-bottom:11px;border-left:4px solid var(--cat,#888)}
.ex.contrast{margin-top:-5px;margin-left:14px;border-left-style:dashed;background:var(--bg2)}
.ex .top{display:flex;align-items:flex-start;gap:10px}
.ex h4{margin:0;font-size:14.5px;font-weight:800;letter-spacing:.005em;line-height:1.25;flex:1}
.cat-pill{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:6px;
  color:var(--cat,#aaa);background:color-mix(in srgb,var(--cat,#888) 16%,transparent);flex:none;white-space:nowrap}
.ex .targets{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.tg{display:flex;flex-direction:column;gap:1px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;
  padding:7px 10px;min-width:56px}
.tg .k{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.tg .v{font-family:var(--f-disp);font-size:16px;letter-spacing:.01em;line-height:1}
.tg.kg .v{color:var(--accent)}
.tg .v small{font-family:var(--f-body);font-size:10px;color:var(--muted);font-weight:600}
.cues{font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:10px}
.cues b{color:#ffcf9f;font-weight:700}
.sets{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;align-items:center}
.setbox{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line2);background:var(--surface2);cursor:pointer;
  font-family:var(--f-disp);font-size:13px;color:var(--muted);display:grid;place-items:center;transition:.14s;letter-spacing:.02em}
.setbox.done{background:var(--cat,var(--accent));border-color:transparent;color:#0c0d11;animation:pop .26s ease}
.logtoggle{margin-left:auto;background:none;border:1px solid var(--line2);color:var(--muted);border-radius:9px;
  padding:6px 11px;cursor:pointer;font-weight:700;font-size:11px;letter-spacing:.03em;display:inline-flex;gap:5px;align-items:center}
.logtoggle svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.set-log-panel{display:none;margin-top:10px;padding:11px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2);animation:fade .2s ease}
.set-log-panel.open{display:block}
.set-log-panel .slp-header{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.set-log-panel .slp-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.set-log-panel label{font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:3px;display:block}
.set-log-panel input{padding:8px 6px;font-size:14px;font-family:var(--f-disp);letter-spacing:.02em;text-align:center;width:100%}
.setbox.active-log{box-shadow:0 0 0 2px var(--cat,var(--accent));color:var(--text)}

.deload-note{margin-top:6px;padding:13px 15px;border-radius:14px;border:1px solid rgba(248,113,113,.3);
  background:rgba(248,113,113,.07);color:#fca5a5;font-size:12px;font-weight:600;line-height:1.5;display:flex;gap:9px}

/* 1RM table */
.rm-intro{padding:15px 16px;margin-bottom:14px}
.rm-intro p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.rm-row{padding:13px 14px;margin-bottom:9px}
.rm-row .head{display:flex;align-items:center;gap:11px}
.rm-row .nm{font-weight:800;font-size:14px;flex:1}
.rm-row .inp{display:flex;align-items:center;gap:7px}
.rm-row .inp input{width:78px;text-align:center;font-family:var(--f-disp);font-size:17px;letter-spacing:.02em;padding:7px}
.rm-row .inp span{font-size:11px;color:var(--muted);font-weight:700}
.pcts{display:flex;gap:6px;overflow-x:auto;margin-top:11px;padding-bottom:3px;-webkit-overflow-scrolling:touch}
.pcts::-webkit-scrollbar{height:5px}.pcts::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.pc{flex:none;text-align:center;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;min-width:48px}
.pc .p{font-size:8.5px;color:var(--faint);font-weight:800;letter-spacing:.06em}
.pc .w{font-family:var(--f-disp);font-size:15px;letter-spacing:.01em;margin-top:1px}
.pc.hot{border-color:var(--accent);background:var(--accent-soft)}
.pc.hot .w{color:var(--accent)}
.week-prog-single{display:flex;align-items:center;gap:7px;margin-bottom:9px;padding:7px 10px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);flex-wrap:wrap}
.week-prog-single.emom-badge{border-color:#3b82f6;background:rgba(59,130,246,.07)}
.week-prog-single.deload-hint{border-color:var(--muted);opacity:.7}
.wp-icon{font-size:14px;flex-shrink:0}
.wp-main{font-size:12px;font-weight:800;color:var(--text);letter-spacing:.02em}
.week-prog-single.emom-badge .wp-main{color:#60a5fa}
.wp-kg{font-size:11px;font-weight:700;color:var(--accent);margin-left:2px}
.wp-note{font-size:10px;color:var(--muted);margin-left:auto}
.tip{padding:13px 15px;border-radius:13px;background:rgba(255,122,26,.07);border:1px solid rgba(255,122,26,.22);
  color:#ffcf9f;font-size:11.5px;line-height:1.5;display:flex;gap:9px;margin-top:4px}

.jtype-section{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.jtype-block{border:1px solid var(--line2);border-radius:11px;padding:10px 12px;background:var(--surface2)}
.jtype-label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.jtype-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.jfield-calc .jcalc-val{padding:8px 6px;font-size:13px;font-family:var(--f-disp);letter-spacing:.02em;text-align:center;color:var(--accent);font-weight:700;background:var(--surface);border:1px solid var(--line2);border-radius:9px}
/* Jump tracker */
.jump-row{padding:14px 15px;margin-bottom:11px}
.jump-row .rh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.jump-row .rh .lab{font-weight:800;font-size:13.5px}
.jump-row .rh .ms{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#0c0d11;
  padding:3px 8px;border-radius:7px}
.jgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.jgrid.dates{grid-template-columns:1fr;margin-bottom:8px}
.jfield label{font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:4px;display:block}
.jfield input{text-align:center;padding:8px 6px;font-size:14px;font-family:var(--f-disp);letter-spacing:.02em}
.jfield.note input{font-family:var(--f-body);font-size:12px;text-align:left}
.jdelta{display:flex;gap:14px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line2)}
.jdelta .d{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700}
.jdelta .d b{display:block;font-family:var(--f-disp);font-size:16px;letter-spacing:.02em;margin-top:2px;color:var(--text)}
.jdelta .d b.up{color:var(--good)} .jdelta .d b.dn{color:var(--bad)}
.chart-card{padding:16px 14px 12px;margin-bottom:16px}

async function loadKey(k,fb){
  // Prefer localStorage (works on any host, e.g. GitHub Pages). Fall back to Claude artifact storage if present.
  if(hasLocalStore){
    try{ const raw=window.localStorage.getItem(k); if(raw!=null) return JSON.parse(raw); }catch(e){}
  }
  if(hasClaudeStore){
    try{const r=await window.storage.get(k); return (r&&r.value!=null)?JSON.parse(r.value):fb;}catch(e){return fb;}
  }
  return fb;
}
const savers={};
function saveKey(k,v){
  if(hasLocalStore){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

}

  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importBackupFile(file){
  const reader=new FileReader();
  reader.onload=async ()=>{
    try{
      const payload=JSON.parse(reader.result);
      if(payload.vb_onerm) DB.onerm=payload.vb_onerm;
      if(payload.vb_training){ DB.training=payload.vb_training; if(!DB.training.done)DB.training.done={}; if(!DB.training.log)DB.training.log={}; }
      if(payload.vb_jump) DB.jump=payload.vb_jump;
      if(payload.vb_settings) DB.settings=payload.vb_settings;
      saveKey('vb_onerm',DB.onerm); saveKey('vb_training',DB.training); saveKey('vb_jump',DB.jump); saveKey('vb_settings',DB.settings);
      alert('Backup erfolgreich importiert!');
      render();
    }catch(e){ alert('Import fehlgeschlagen — Datei konnte nicht gelesen werden.'); }
  };
  reader.readAsText(file);
}

async function boot(){
  // If this device/browser has never stored training data before, seed it once from the embedded backup (2026-06-26),
  // so switching to a new app version doesn't start you from zero. Once any real data exists, the seed is never used again.
  let alreadyHasData=false;
  if(hasLocalStore){ try{ alreadyHasData = window.localStorage.getItem('vb_training')!=null; }catch(e){} }
  if(!alreadyHasData && hasClaudeStore){ try{ const r=await window.storage.get('vb_training'); alreadyHasData = !!(r&&r.value!=null); }catch(e){} }
  if(!alreadyHasData && typeof SEED_BACKUP!=='undefined'){
    SEED_APPLIED=true; // → Warnhinweis auf der Startseite, damit kein Stand still überschrieben wird
    DB.onerm=SEED_BACKUP.vb_onerm||DB.onerm;
    DB.training=SEED_BACKUP.vb_training||DB.training;
    DB.jump=SEED_BACKUP.vb_jump||DB.jump;
    DB.settings=SEED_BACKUP.vb_settings||DB.settings;
    saveKey('vb_onerm',DB.onerm); saveKey('vb_training',DB.training); saveKey('vb_jump',DB.jump); saveKey('vb_settings',DB.settings);
  }
  DB.onerm    = await loadKey('vb_onerm', DB.onerm);
  DB.training = await loadKey('vb_training', DB.training);
  DB.jump     = await loadKey('vb_jump', DB.jump);
  DB.settings = await loadKey('vb_settings', DB.settings);
  if(!DB.training.done) DB.training.done={}; if(!DB.training.log) DB.training.log={};
  buildTabs(); render();
}

/* ---------- helpers ---------- */
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function computeRSI(cm,ctMs){
  const h=parseFloat(cm), ct=parseFloat(ctMs);
  if(isNaN(h)||isNaN(ct)||ct<=0) return null;
  return (h/(ct/1000)/100).toFixed(2); // RSI = jump height(m) / contact time(s), height converted cm->m
}
function emph(s){ return esc(s).replace(/(OPTIONAL|Kontrast|Deload|DELOAD|frisch|Technik ist König|niemals|IMMER|Pflicht|PR!|supramaximal|105%)/g,'<b>$1</b>'); }
const round0=x=>Math.round(x);
function targetKg(calc){ if(!calc) return null; const m=DB.onerm[calc.lift]; if(!m) return null; return round0(m*calc.pct); }

/* ---- Deload: gilt für ALLE Übungen (Plyometrie stärker reduziert) ---- */
const DELOAD_VOL=0.6, DELOAD_VOL_PLYO=0.5, DELOAD_INT=0.875;
const isPlyoCat=ex=>String(ex.cat||'').indexOf('Plyos')===0;
const deloadFactor=ex=>isPlyoCat(ex)?DELOAD_VOL_PLYO:DELOAD_VOL;
function effExercise(exRaw,week){
  return (exRaw.weekOverride && exRaw.weekOverride[week]) ? {...exRaw, ...exRaw.weekOverride[week]} : exRaw;
}
/* Einzige Quelle der Wahrheit für die Satzanzahl einer Woche — Karten,
   Fortschrittsbalken und Bestwert-Erkennung nutzen alle diese Funktion. */
function effectiveSets(exRaw,week){
  const ex=effExercise(exRaw,week);
  const wl=(ex.weeklyLoad && week<3) ? ex.weeklyLoad[week] : null;
  const base=wl?wl.sets:ex.sets;
  return week===3 ? Math.max(1,Math.round(base*deloadFactor(ex))) : base;
}
/* Sprunghöhe eines Tracker-Feldes: direkte cm-Eingabe, sonst aus der Flugzeit */
function jumpCm(row,typeKey){
  if(!row) return null;
  const direct=parseFloat(row[typeKey]);
  if(!isNaN(direct)&&direct>0) return direct;
  const ft=flightTimeToCm(row[typeKey+'_ft']);
  return (ft&&ft>0)?ft:null;
}
function currentProgram(){
  const sd=DB.settings.startDate; if(!sd) return null;
  const start=new Date(sd+'T00:00:00'); if(isNaN(start)) return null;
  const days=Math.floor((Date.now()-start)/864e5); if(days<0) return {wk:0,meso:0,wkIn:0,pre:true};
  const wk=Math.min(days/7|0,23); return {wk, meso:(wk/4|0), wkIn:wk%4, days};
}

function exerciseCard(exRaw,xi,mi,col){
  // Apply weekOverride first (e.g. RDL 1RM-test in M2 week 1), then weeklyLoad on top of whichever exercise definition is active
  const ex = (exRaw.weekOverride && exRaw.weekOverride[S.week]) ? {...exRaw, ...exRaw.weekOverride[S.week]} : exRaw;
  const cat=CAT_COLOR[ex.cat]||'#888';
  const isContrast=/^→/.test(ex.name);

  // weeklyLoad: per-week sets/pct progression (W1-W3), W4 = deload uses base values
  const wl = (ex.weeklyLoad && S.week < 3) ? ex.weeklyLoad[S.week] : null;
  const isDeload = S.week === 3;
  const baseSets = wl ? wl.sets : ex.sets;
  // Deload greift jetzt bei JEDER Übung — auch Accessories und Plyometrie (die sogar −50%)
  const activeSets = isDeload ? Math.max(1, Math.round(baseSets * deloadFactor(ex))) : baseSets;
  const topPct = (ex.weeklyLoad && ex.weeklyLoad[2] && ex.weeklyLoad[2].pct != null)
    ? ex.weeklyLoad[2].pct : (ex.calc ? ex.calc.pct : null);
  const activePct  = isDeload
    ? (topPct != null ? topPct * DELOAD_INT : null)
    : (wl && wl.pct != null ? wl.pct : (ex.calc ? ex.calc.pct : null));
  const activeCalc = activePct != null ? {...(ex.calc||{}), pct: activePct} : ex.calc;
  const kg=targetKg(activeCalc);

  let weekProgHTML = '';
  if(ex.weeklyLoad && S.week < 3){
    const w = ex.weeklyLoad[S.week];
    const isEmom = !!w.emom;
    const kgVal = (w.pct && ex.calc) ? Math.round((DB.onerm[ex.calc.lift]||100)*w.pct/2.5)*2.5 : null;
    const pctStr = w.pct ? Math.round(w.pct*100)+'%' : null;
    if(isEmom){
      weekProgHTML = `<div class="week-prog-single emom-badge">
        <span class="wp-icon">⏱</span>
        <span class="wp-main">${esc(w.note)}</span>
        ${kgVal?`<span class="wp-kg">${kgVal} kg</span>`:''}
      </div>`;
    } else if(w.pct !== (ex.calc?.pct??null) || w.sets !== ex.sets){
      weekProgHTML = `<div class="week-prog-single">
        <span class="wp-icon">📈</span>
        <span class="wp-main">${w.sets}× ${pctStr||'BW'}${kgVal?' · '+kgVal+' kg':''}</span>
        <span class="wp-note">${esc(w.note)}</span>
      </div>`;
    }
  } else if(S.week === 3){
    // Deload: reduzierte Sätze/Last — für jede Übungsart, nicht nur die mit weeklyLoad
    const deloadPct = activePct != null ? Math.round(activePct * 100) + '%' : null;
    const deloadKg = (activePct != null && ex.calc) ? Math.round((DB.onerm[ex.calc.lift]||100) * activePct / 2.5)*2.5 : null;
    weekProgHTML = `<div class="week-prog-single deload-hint">
      <span class="wp-icon">🔄</span>
      <span class="wp-main">DELOAD · ${activeSets} Sätze${deloadPct?' · −12% → '+deloadPct:''}</span>
      ${deloadKg?`<span class="wp-kg">${deloadKg} kg</span>`:''}
      <span class="wp-note">${isPlyoCat(ex)?'−50% Kontakte':'−40% Volumen'}${deloadPct?' · −12% Int':''}</span>
    </div>`;
  }

  const tgKg = activeCalc
    ? `<div class="tg kg"><div class="k">Ziel kg</div><div class="v">${kg!=null?kg:'–'}<small> kg</small></div></div>`
    : (ex.pctLabel && ex.pctLabel!=='BW / Tech' && ex.pctLabel!=='—'
        ? `<div class="tg"><div class="k">%1RM</div><div class="v" style="font-size:14px">${esc(ex.pctLabel)}</div></div>`
        : `<div class="tg"><div class="k">Last</div><div class="v" style="font-size:13px;color:var(--muted)">${ex.pctLabel==='BW / Tech'?'BW':'Technik'}</div></div>`);
  const pctTag = activeCalc ? `<div class="tg"><div class="k">%1RM</div><div class="v" style="font-size:14px">${activePct?Math.round(activePct*100)+'%':esc(ex.pctLabel)}</div></div>` : '';

  let setItems='';
  for(let s=0;s<activeSets;s++){
    const on=DB.training.done[key(mi,S.dayIdx,S.week,xi,s)];
    const lgS=DB.training.log[key(mi,S.dayIdx,S.week,xi,s)]||{};
    if(ex.isReactiveTest){
      const rsi=computeRSI(lgS.cm,lgS.ct);
      const hasLog=lgS.cm||lgS.ct;
      const logSummary=hasLog?`<span style="font-size:9px;color:var(--muted);margin-left:4px">${lgS.cm?lgS.cm+'cm':''}${lgS.ct?' · '+lgS.ct+'ms':''}${rsi!=null?' · RSI '+rsi:''}</span>`:'';
      setItems+=`<div class="set-item">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <button class="setbox ${on?'done':''}" data-set="${xi}:${s}" data-setlog="${xi}:${s}" style="${on?'background:'+col:''}">${s+1}</button>
          ${logSummary}
        </div>
        <div class="set-log-panel" id="slp-${xi}-${s}">
          <div class="slp-header">Sprung ${s+1} — Höhe &amp; Reaktivität</div>
          <div class="slp-grid">
            <div><label>cm</label><input type="number" inputmode="decimal" data-lij="${xi}:${s}:cm" value="${esc(lgS.cm||'')}" placeholder="z.B. 52"></div>
            <div><label>Kontaktzeit ms</label><input type="number" inputmode="decimal" data-lij="${xi}:${s}:ct" value="${esc(lgS.ct||'')}" placeholder="optional"></div>
            <div><label>RSI</label><input type="text" value="${rsi!=null?rsi:'–'}" disabled style="opacity:.6"></div>
          </div>
          <div style="font-size:9.5px;color:var(--faint);margin-top:6px">RSI = Sprunghöhe ÷ Kontaktzeit. Kontaktzeit optional — z.B. per My Jump Lab App (iPhone) per Slow-Mo-Video gemessen.</div>
        </div>
      </div>`;
      continue;
    }
    if(ex.isJumpTest){
      const hasLog=lgS.cm;
      const logSummary=hasLog?`<span style="font-size:9px;color:var(--muted);margin-left:4px">${lgS.cm} cm</span>`:'';
      setItems+=`<div class="set-item">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <button class="setbox ${on?'done':''}" data-set="${xi}:${s}" data-setlog="${xi}:${s}" style="${on?'background:'+col:''}">${s+1}</button>
          ${logSummary}
        </div>
        <div class="set-log-panel" id="slp-${xi}-${s}">

/* ---------- JUMP ---------- */
// Flight time → jump height: h = g * t² / 8 (t in seconds, h in meters)
// Because flight time = 2 * time_to_peak, and h = g * t_peak² / 2
function flightTimeToCm(ms){
  if(!ms || isNaN(ms)) return null;
  const t = parseFloat(ms) / 1000; // ms → s
  const h = 9.81 * t * t / 8;     // meters
  return Math.round(h * 100 * 10) / 10; // cm with 1 decimal
}
function cmToFlightTimeMs(cm){
  if(!cm || isNaN(cm)) return null;
  const h = parseFloat(cm) / 100;  // cm → m
  const t = Math.sqrt(8 * h / 9.81); // seconds
  return Math.round(t * 1000);      // ms
}

function jumpFieldBlock(rowIdx, type, label, r){
  const cmKey = type;
  const ftKey = type + '_ft';
  const cmVal = r[cmKey] || '';
  const ftVal = r[ftKey] || '';
  const derivedCm = !cmVal && ftVal ? flightTimeToCm(ftVal) : null;
  const derivedFt = !ftVal && cmVal ? cmToFlightTimeMs(cmVal) : null;
  return `<div class="jtype-block">
    <div class="jtype-label">${label}</div>
    <div class="jtype-fields">
      <div class="jfield">
        <label>cm</label>
        <input type="number" inputmode="decimal" data-j="${rowIdx}:${cmKey}" value="${esc(cmVal)}" placeholder="${derivedCm!=null?'≈'+derivedCm:'–'}">
      </div>
      <div class="jfield">
        <label>Flugzeit ms</label>
        <input type="number" inputmode="numeric" data-j="${rowIdx}:${ftKey}" value="${esc(ftVal)}" placeholder="${derivedFt!=null?'≈'+derivedFt+'ms':'optional'}">
      </div>
      <div class="jfield jfield-calc">
        <label>Berechnet</label>
        <div class="jcalc-val">${cmVal?cmVal+' cm':(derivedCm!=null?'≈'+derivedCm+' cm':'–')}</div>
      </div>
    </div>
  </div>`;
}

function drawChart(){
  const cv=document.getElementById('jchart'); if(!cv)return;
  const ctx=cv.getContext('2d'); const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
  const padL=30,padR=12,padT=14,padB=22;
  const series=[['squat','#ff7a1a'],['approach','#60a5fa'],['block','#34d399']];
  let vals=[]; DB.jump.forEach(r=>series.forEach(([k])=>{const v=jumpCm(r,k); if(v!=null)vals.push(v);}));
  if(vals.length<1){ ctx.fillStyle='#6b7280';ctx.font='600 13px Manrope,sans-serif';ctx.textAlign='center';
    ctx.fillText('Trage Sprungwerte ein, um den Verlauf zu sehen',W/2,H/2); return; }
  let mn=Math.min(...vals),mx=Math.max(...vals); if(mn===mx){mn-=5;mx+=5;} const rng=mx-mn||1; mn=Math.floor((mn-2)); mx=Math.ceil(mx+2);
  const n=DATA.jump.rows.length;
  const X=i=> padL + (W-padL-padR)*(n<2?0.5:i/(n-1));
  const Y=v=> padT + (H-padT-padB)*(1-(v-mn)/(mx-mn));
  // grid
  ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1; ctx.fillStyle='#6b7280';ctx.font='600 9px Manrope,sans-serif';ctx.textAlign='right';
  for(let g=0;g<=3;g++){ const val=mn+(mx-mn)*g/3; const y=Y(val); ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke(); ctx.fillText(Math.round(val),padL-5,y+3); }
  series.forEach(([k,col])=>{
    const pts=[]; DB.jump.forEach((r,i)=>{ const v=jumpCm(r,k); if(v!=null)pts.push([i,v]); });
    if(pts.length>=2){ ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.lineJoin='round';ctx.beginPath();
      pts.forEach((p,j)=>{const x=X(p[0]),y=Y(p[1]); j?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.stroke(); }
    pts.forEach(p=>{const x=X(p[0]),y=Y(p[1]); ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,3.6,0,7);ctx.fill();
      ctx.fillStyle='#0c0d11';ctx.beginPath();ctx.arc(x,y,1.5,0,7);ctx.fill();});
  });
}

    DB.training.log[k]=DB.training.log[k]||{}; DB.training.log[k][f]=t.value; saveKey('vb_training',DB.training);

      }
    }
    // Auto-Sync in den Sprung-Tracker: Bestwert über ALLE 4 Wochen des Blocks,
    // damit eine müde Woche einen guten Wert nicht überschreibt.
    const day=DATA.mesos[S.mesoIdx].days[S.dayIdx]; const ex=day.exercises[xi];

      // Nur echte Sprunghöhen-Tests werden als Sprunghöhe übernommen —
      // Box/Depth Jumps tragen eine Absprunghöhe, keine Sprunghöhe.
      let best=null;
      for(let w=0;w<4;w++){ const n=effectiveSets(ex,w);
        for(let s=0;s<n;s++){ const v=parseFloat((DB.training.log[key(S.mesoIdx,S.dayIdx,w,xi,s)]||{}).cm);
          if(!isNaN(v) && (best===null||v>best)) best=v; } }
      if(best!=null){
        const nm=ex.name;
        const field = /block/i.test(nm) ? 'block' : (/anlauf|approach|vertical/i.test(nm) ? 'approach' : 'squat');
        DB.jump[rowIdx]=DB.jump[rowIdx]||{};
        const cur=parseFloat(DB.jump[rowIdx][field]);
        if(isNaN(cur)||best>cur) DB.jump[rowIdx][field]=String(best);
        if(!DB.jump[rowIdx].date) DB.jump[rowIdx].date=new Date().toISOString().slice(0,10);
        touched=true;
      }
    }
    if(ex.isReactiveTest){
      let bestRSI=null;
      for(let w=0;w<4;w++){ const n=effectiveSets(ex,w);
        for(let s=0;s<n;s++){ const lg=DB.training.log[key(S.mesoIdx,S.dayIdx,w,xi,s)]||{};
          const r=parseFloat(computeRSI(lg.cm,lg.ct));
          if(!isNaN(r) && (bestRSI===null||r>bestRSI)) bestRSI=r; } }
      if(bestRSI!=null){
        DB.jump[rowIdx]=DB.jump[rowIdx]||{};
        const curR=parseFloat(DB.jump[rowIdx].rsi);
        if(isNaN(curR)||bestRSI>curR) DB.jump[rowIdx].rsi=String(bestRSI);
        touched=true;
      }
    }
    if(touched){ saveKey('vb_jump',DB.jump); drawChart(); refreshJumpDeltas(); }
    return; }
});

<!-- ==========================================================================
     KNIE-BLOCK ADD-ON  ·  2 Wochen Sehnen-Reha  ·  v1.0  (2026-09-22)

     EINFÜGEN:  diesen ganzen Block ans Ende von index-2.html setzen, direkt
                vor dem schliessenden body-Tag — also NACH dem bestehenden
                Script-Block. Am bestehenden Code aendert sich nichts.

     ENTFERNEN: Block wieder löschen. Deine Daten (1RM, Logs, Sprünge,
                Schmerz-Check) bleiben im Speicher erhalten.

     WAS ES MACHT:
       · fügt einen Block "KNIE" mit 2 Wochen à 3 Tagen hinzu, angezeigt
         zwischen M4 und M5 (intern liegt er hinten, damit gespeicherte
         Satz-Keys, currentProgram() und Sprung-Tracker unverändert bleiben)
       · schwere Exzentrik (5 s) -> Heavy Slow Resistance 3 s/3 s @65–72 %
       · Isometrie (Spanish Squat, Beinstrecker) als Hauptreiz
       · reaktive Plyos raus, nur Box Jump mit Absteigen + Pogo flach
       · Morgen-Schmerz-Check (links/rechts 0–10) mit Verlauf
       · Banner auf der Übersicht + Button zum Block
       · beim ersten Start einmalig direkt in den Knie-Block
     ========================================================================== -->
<script>
(function () {
  'use strict';

  /* ---------- Vorbedingungen ---------- */
  if (typeof DATA === 'undefined' || !DATA || !Array.isArray(DATA.mesos)) {
    console.warn('[Knie-Block] DATA nicht gefunden — Add-on inaktiv.');
    return;
  }
  if (DATA.__kneeBlock) return;        // doppeltes Einfügen abfangen
  DATA.__kneeBlock = true;

  const HEX = '#2dd4bf';               // Farbe des Knie-Blocks
  const KI  = DATA.mesos.length;       // Index des neuen Blocks

  const _esc = (typeof esc === 'function')
    ? esc
    : (s => (s == null ? '' : String(s)).replace(/[&<>"]/g,
        c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])));

  /* ---------- Bausteine ---------- */
  // weeklyLoad braucht 4 Einträge (die App greift auf Index 0–3 zu).
  // W3/W4 spiegeln W2, damit auch bei ungewollter Wochenwahl nichts bricht.
  const wl = (a, b) => [a, b, b, b];
  const ex = (cat, name, repGoal, cues, sets, calc, weeklyLoad) => {
    const o = { cat: cat, name: name, repGoal: repGoal, cues: cues, sets: sets,
                calc: calc || null,
                pctLabel: calc ? (Math.round(calc.pct * 100) + '%') : 'BW / Tech' };
    if (weeklyLoad) o.weeklyLoad = weeklyLoad;
    return o;
  };

  const SPANISH = c => ex('Iso', 'Spanish Squat (Band) — isometrisch', '45 sek',
    'Schweres Band um einen Pfosten, in BEIDE Kniekehlen. Zurücklehnen, Schienbeine senkrecht, 60–90° beugen und halten. Deutlich anstrengend, Schmerz max 3/10 — links flacher bleiben, wenn es oberhalb der Kniescheibe drückt. Wirkt schmerzdämpfend, deshalb ZUERST. W2: Hantel vor der Brust dazu. Auch an freien Tagen erlaubt.',
    c, null);

  const EXT_ISO = c => ex('Iso', 'Beinstrecker einbeinig — Isometrie 60°', '45 sek je Seite',
    'Ein Bein, ca. 60° Beugung, Gewicht halten statt bewegen. Links und rechts getrennt dosieren — die Seite mit mehr Schmerz bekommt weniger Gewicht, nicht weniger Zeit. Schmerz max 3/10.',
    c, null);

  const ABD = ex('Reha', 'Hüftabduktion (Band-Walk / Seitlage)', '15 je Seite',
    'Seitliche Hüftmuskulatur — wegen der Außenseite links. Langsam, keine Ausweichbewegung im Rumpf. 3×/Woche.',
    3, null);

  /* ---------- Trainingstage ---------- */
  const DAYS = [
    {
      name: 'TAG 1 – Sehne & Quadrizeps (HSR + Isometrie)',
      exercises: [
        SPANISH(5),
        ex('Squat', 'Back Squat — HSR 3 s runter / 3 s hoch', '6–8',
          'ERSATZ für Slow Eccentric Squat und Cluster. Tempo 3 s/3 s, kein Bounce, kein Grinding. Nur so tief wie SCHMERZARM — notfalls Box Squat auf Parallel. W1 @65 %, W2 @70 % nur wenn der Morgenwert stabil ist.',
          4, { lift: 'back_squat', pct: 0.65 },
          wl({ sets: 4, pct: 0.65, note: 'W1 · 3s/3s @65%' },
             { sets: 4, pct: 0.70, note: 'W2 · @70% wenn Morgenwert stabil' })),
        ex('Squat', 'Leg Press — HSR 3 s / 3 s', '8',
          'Geführte Last, gut dosierbar. Fuß eher hoch stellen = weniger Kniemoment. Knie am Ende nicht durchstrecken.',
          3, { lift: 'leg_press', pct: 0.55 },
          wl({ sets: 3, pct: 0.55, note: 'W1 @55%' },
             { sets: 3, pct: 0.60, note: 'W2 @60%' })),
        EXT_ISO(5),
        ex('Wade', 'Calf Raise einbeinig — 3 s exzentrisch', '10 je Seite',
          'Wade bleibt drin, sie ist nicht das Problem. Volle ROM, langsam runter.', 3, null),
        ABD,
        ex('Plyos', 'Box Jump MIT Absteigen', '4',
          'NUR wenn der Morgenwert höchstens dem Normalwert entspricht. Rauf springen, runter STEIGEN — fast keine Landelast. Kein Depth, kein Reactive, kein Hurdle.',
          2, null,
          wl({ sets: 2, pct: null, note: 'W1 · 2 Sätze' },
             { sets: 3, pct: null, note: 'W2 · 3 Sätze' })),
        ex('Plyos', 'Pogo Jumps (flach)', '10',
          'Flache Amplitude, fast nur Fußgelenk, Knie kaum gebeugt. Bei Schmerz über 3/10 sofort streichen.',
          2, null,
          wl({ sets: 2, pct: null, note: 'W1 · 2 Sätze' },
             { sets: 3, pct: null, note: 'W2 · 3 Sätze' }))
      ]
    },
    {
      name: 'TAG 2 – Hüfte & Posterior Chain (knieschonend)',
      exercises: [
        SPANISH(4),
        ex('Hinge', 'Romanian Deadlift', '6',
          'Läuft normal weiter — Hüftdominant, kniefreundlich. Hüfte zurück, Stretch im Hamstring, neutraler Rücken.',
          4, { lift: 'rdl', pct: 0.70 },
          wl({ sets: 4, pct: 0.70, note: 'W1 @70%' },
             { sets: 4, pct: 0.725, note: 'W2 @72,5%' })),
        ex('Hinge', 'Hip Thrust', '8',
          'Volle Hüftextension, 1 s Squeeze oben. Glute-Kraft hält die Sprungleistung, ohne das Knie zu belasten.',
          4, { lift: 'hip_thrust', pct: 0.70 },
          wl({ sets: 4, pct: 0.70, note: 'W1 @70%' },
             { sets: 4, pct: 0.725, note: 'W2 @72,5%' })),
        ex('Hinge', 'Nordic Hamstring Curl', '5',
          'Bleibt drin. Langsam runter, exzentrischer Fokus.', 3, null),
        ex('Hinge', 'Reverse Hyper', '12',
          'Posterior Chain ohne Kniebelastung, entlastet zusätzlich die Lendenwirbelsäule.', 3, null),
        ex('Olympic', 'Clean Pull', '3',
          'Explosivität ohne Landung — dein bester Power-Reiz in diesen zwei Wochen. Triple Extension, kein Arm-Zug.',
          4, { lift: 'clean_pull', pct: 0.80 },
          wl({ sets: 4, pct: 0.78, note: 'W1 @78%' },
             { sets: 4, pct: 0.80, note: 'W2 @80%' })),
        ex('Upper', 'Med Ball Overhead Throw', '5',
          '4–5 kg, maximale Wurfexplosivität. Ersetzt einen Teil des fehlenden Sprungvolumens.', 4, null),
        ex('Reha', 'Copenhagen Plank', '20 sek je Seite',
          'Adduktoren — gehört zum frontalen Muster und zur Außenseiten-Problematik. Kurz und sauber statt lang und zitternd.', 3, null)
      ]
    },
    {
      name: 'TAG 3 – Oberkörper & Core (Knie frei)',
      exercises: [
        ex('Upper', 'Push Press', '5',
          'Läuft normal weiter. Hüft-Dip kurz und knapp halten, nicht tief in die Kniebeuge.',
          4, { lift: 'push_press', pct: 0.75 },
          wl({ sets: 4, pct: 0.75, note: 'W1 @75%' },
             { sets: 4, pct: 0.775, note: 'W2 @77,5%' })),
        ex('Upper', 'Dumbbell Bench Press', '8', 'Horizontaler Ausgleich, kontrollierte Exzentrik.', 4, null),
        ex('Upper', 'Weighted Pull-Up', '5', 'Zusatzgewicht progressiv, volle Streckung unten.', 4, null),
        ex('Upper', 'Dumbbell Row', '10 je Seite', 'Voller ROM, Rücken stabil.', 4, null),
        ex('Upper', 'Cable Face Pull', '15', 'Schultergesundheit — nicht überspringen.', 3, null),
        ex('Core', 'Ab Rollout', '8', 'Core-Stiffness, Hüfte stabil.', 3, null),
        ex('Core', 'Pallof Press', '10 je Seite', 'Anti-Rotation, kein Drehen der Hüfte.', 3, null),
        EXT_ISO(5),
        ABD
      ]
    }
  ];

  /* ---------- Block registrieren ---------- */
  DATA.mesos.push({
    code: 'K',
    title: 'KNIE-BLOCK  |  Sehnen-Reha — HSR & Isometrie  |  2 Wochen',
    subtitle: 'Sehne wird durch dosierte Last belastbar, nicht durch Schonung. Schwere 5-s-Exzentrik und alles Reaktive raus, dafür Heavy Slow Resistance 3 s/3 s und Isometrie 5×45 s. Gesteuert wird über den Morgen-Schmerz-Test, nicht über das Gefühl beim Aufwärmen: im Training bis 3/10 ok, liegt der Morgenwert danach über deinem Normalwert, war der Vortag zu viel. Harte Tage bündeln — Gym-Sprünge eher auf Hallentage legen, damit die Sehne 48 h Pause bekommt. Keine Schmerzmittel, um durchzutrainieren.',
    weeks: 'Nach W16 · 2 Wochen',
    days: DAYS,
    deload: '⚠️  Dieser Block hat nur 2 Wochen — W3 und W4 sind ausgeblendet. Danach entweder M5 (nur wenn die Morgenwerte ~2 Wochen stabil niedrig sind) oder eine weitere Brückenwoche.'
  });

  while (DATA.overview.rows.length < KI) DATA.overview.rows.push(DATA.overview.rows[0]);
  DATA.overview.rows[KI] = ['K', 'nach W16', 'Reha', 'Knie-Block · Sehnen-Reha',
    'HSR 3 s/3 s  /  Isometrie 5×45 s',
    'Back Squat HSR, Leg Press HSR, Spanish Squat, RDL, Hip Thrust, Clean Pull',
    'Niedrig', '65–72%', '6–8', '3–5', '6–7',
    'Nur Box Jump mit Absteigen, Pogo flach',
    'Tendon Loading', 'Sehne braucht Last statt Schonung — Steuerung über den Morgen-Schmerz-Test'];

  if (typeof MESO_COLORS !== 'undefined') { while (MESO_COLORS.length <= KI) MESO_COLORS.push(HEX); MESO_COLORS[KI] = HEX; }
  if (typeof MESO_HEX    !== 'undefined') { while (MESO_HEX.length    <= KI) MESO_HEX.push(HEX);    MESO_HEX[KI]    = HEX; }
  if (typeof CAT_COLOR   !== 'undefined') { CAT_COLOR['Iso'] = '#22d3ee'; CAT_COLOR['Reha'] = '#2dd4bf'; }

  /* ---------- Morgen-Schmerz-Check (in DB.settings.knee, läuft im normalen Backup mit) ---------- */
  const today = () => new Date().toISOString().slice(0, 10);
  let selDate = today();

  function store() {
    if (typeof DB === 'undefined') return {};
    DB.settings = DB.settings || {};
    DB.settings.knee = DB.settings.knee || {};
    return DB.settings.knee;
  }
  function persist() {
    if (typeof saveKey === 'function' && typeof DB !== 'undefined') { saveKey('vb_settings', DB.settings); return; }
    try { window.localStorage.setItem('vb_settings', JSON.stringify(DB.settings)); } catch (e) {}
  }
  const clamp10 = v => {
    if (v === '' || v == null) return '';
    let n = parseFloat(String(v).replace(',', '.'));
    if (isNaN(n)) return '';
    return String(Math.max(0, Math.min(10, n)));
  };

  function histHTML() {
    const st = store();
    const ds = Object.keys(st).sort().reverse().slice(0, 8);
    if (!ds.length) return '<div style="font-size:11.5px;color:var(--faint)">Noch keine Einträge. Trage den Wert morgens nach dem Aufstehen ein.</div>';
    return ds.map(d => {
      const v = st[d] || {};
      const mx = Math.max(parseFloat(v.l) || 0, parseFloat(v.r) || 0);
      const col = mx <= 3 ? 'var(--good)' : (mx <= 5 ? 'var(--accent)' : 'var(--bad)');
      return '<div style="display:flex;gap:9px;align-items:baseline;font-size:11.5px;padding:4px 0;border-bottom:1px dashed var(--line)">'
        + '<span style="color:var(--faint);font-weight:700;min-width:74px">' + _esc(d) + '</span>'
        + '<b style="color:' + col + ';font-family:var(--f-disp);letter-spacing:.02em">L ' + _esc(v.l || '–') + ' / R ' + _esc(v.r || '–') + '</b>'
        + (v.n ? '<span style="color:var(--muted)">' + _esc(v.n) + '</span>' : '')
        + '</div>';
    }).join('');
  }

  function panelHTML() {
    const e = store()[selDate] || {};
    return '<div class="card jump-row" id="knee-panel" style="border-left:4px solid ' + HEX + '">'
      + '<div class="rh"><div class="lab">Morgen-Schmerz-Check</div>'
      + '<div class="ms" style="background:' + HEX + '">0–10</div></div>'
      + '<div style="font-size:11.5px;color:var(--muted);line-height:1.5;margin-bottom:11px">'
      + '5 einbeinige Kniebeugen bis ca. 60° pro Bein, direkt nach dem Aufstehen, jeden Tag gleich. '
      + 'Im Training sind bis 3/10 ok. Liegt der Morgenwert über deinem Normalwert, war der Vortag zu viel — nächste Einheit zurückfahren. '
      + 'Eine Woche stabil = vorsichtig steigern.</div>'
      + '<div class="jgrid dates"><div class="jfield"><label>Datum</label>'
      + '<input type="date" data-knee="date" value="' + _esc(selDate) + '"></div></div>'
      + '<div class="jgrid">'
      + '<div class="jfield"><label>Links 0–10</label><input type="number" inputmode="decimal" min="0" max="10" data-knee="l" value="' + _esc(e.l || '') + '" placeholder="–"></div>'
      + '<div class="jfield"><label>Rechts 0–10</label><input type="number" inputmode="decimal" min="0" max="10" data-knee="r" value="' + _esc(e.r || '') + '" placeholder="–"></div>'
      + '<div class="jfield note"><label>Notiz</label><input type="text" data-knee="n" value="' + _esc(e.n || '') + '" placeholder="Halle, Schlaf, ..."></div>'
      + '</div>'
      + '<div style="margin-top:12px;padding-top:11px;border-top:1px dashed var(--line2)">'
      + '<div style="font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:6px">Verlauf</div>'
      + '<div id="knee-hist">' + histHTML() + '</div></div>'
      + '</div>';
  }

  /* ---------- DOM-Injektion (kein Eingriff in bestehende Render-Funktionen) ---------- */
  const screen = document.getElementById('screen');
  if (!screen) { console.warn('[Knie-Block] #screen fehlt — Add-on inaktiv.'); return; }
  let busy = false;

  // Der Block liegt im DATA-Array hinten (Index KI), damit die gespeicherten
  // Satz-Keys, currentProgram() und der Sprung-Tracker unverändert bleiben.
  // Angezeigt wird er aber dort, wo er zeitlich hingehört: zwischen M4 und M5.
  const SLOT = 4;                       // Anzeigeposition = nach dem 4. Element
  function moveIntoSlot(nodes) {
    if (nodes.length !== KI + 1 || SLOT >= KI) return null;
    // Nach dem ersten Verschieben stimmt die DOM-Reihenfolge nicht mehr mit der
    // Datenreihenfolge überein — das Knie-Element wird deshalb markiert und
    // danach über die Markierung wiedergefunden, nicht über seine Position.
    let knee = nodes.find(n => n.dataset && n.dataset.kneeNode === '1');
    if (!knee) knee = nodes[KI];
    if (!knee) return null;
    if (knee.dataset) knee.dataset.kneeNode = '1';
    const before = nodes.filter(n => n !== knee)[SLOT];
    if (before && before.previousElementSibling !== knee) {
      before.parentNode.insertBefore(knee, before);
    }
    return knee;
  }

  function enhanceHome() {
    try {
      const segs = [...screen.querySelectorAll('.timeline .seg')];
      moveIntoSlot(segs);
      const l = [...screen.querySelectorAll('.tl-labels span')];
      if (l.length === KI + 1) {
        const names = [];
        for (let i = 0; i < KI; i++) names.push('M' + (i + 1));
        names.splice(SLOT, 0, 'K');
        l.forEach((el, i) => { if (names[i] && el.textContent !== names[i]) el.textContent = names[i]; });
      }
      const v = screen.querySelectorAll('.hero .meta .v');
      if (v[1] && v[1].textContent.trim() === String(KI)) v[1].textContent = KI + '+K';
    } catch (err) {}
    if (screen.querySelector('#knee-banner')) return;
    screen.insertAdjacentHTML('afterbegin',
      '<div class="card block-card" id="knee-banner" style="border-left:4px solid ' + HEX + ';margin-bottom:14px">'
      + '<span class="tag" style="background:' + HEX + '">KNIE · 2 WOCHEN</span>'
      + '<h3>Knie-Block läuft</h3>'
      + '<div class="ph">Liegt zwischen M4 und M5. HSR und Isometrie statt schwerer Exzentrik, reaktive Plyos raus. Morgens den Schmerz-Check eintragen.</div>'
      + '<div style="margin-top:13px"><button class="btn" data-openmeso="' + KI + '" data-week="0">Knie-Block öffnen</button></div>'
      + '</div>');
  }

  function enhanceMesoList() {
    const knee = moveIntoSlot([...screen.querySelectorAll('.meso-card')]);
    const badge = knee && knee.querySelector('.meso-badge');
    if (badge && badge.textContent.trim() !== 'K') badge.textContent = 'K';
  }

  function enhanceGuide() {
    const knee = moveIntoSlot([...screen.querySelectorAll('.ov-tbl .ov-row')]);
    const bd = knee && knee.querySelector('.bd');
    if (bd && bd.textContent.trim() !== 'K') bd.textContent = 'K';
  }

  function enhanceDetail() {
    if (typeof S !== 'undefined' && S.week > 1) {   // Knie-Block hat nur 2 Wochen
      S.week = 0;
      if (typeof render === 'function') render();
      return;
    }
    const head = screen.querySelector('.detail-head');
    if (head && !screen.querySelector('#knee-panel')) head.insertAdjacentHTML('afterend', panelHTML());
    const wc = screen.querySelector('.weekctl');
    if (wc && !wc.dataset.kneeDone) {
      const bs = wc.querySelectorAll('button');
      if (bs[0]) bs[0].innerHTML = 'W1<small>Knie 1</small>';
      if (bs[1]) bs[1].innerHTML = 'W2<small>Knie 2</small>';
      for (let i = 2; i < bs.length; i++) bs[i].style.display = 'none';
      wc.style.gridTemplateColumns = 'repeat(2,1fr)';
      wc.dataset.kneeDone = '1';
    }
  }

  // Beim allerersten Rendern nach dem Einbau einmalig direkt in den Knie-Block
  // springen, damit man sofort loslegen kann. Danach normale Navigation.
  function firstRunJump() {
    if (typeof DB === 'undefined' || !DB.settings) return false;
    if (DB.settings.kneeEntered) return false;
    DB.settings.kneeEntered = true;
    persist();
    S.view = 'training'; S.mesoIdx = KI; S.dayIdx = 0; S.week = 0;
    if (typeof render === 'function') { render(); return true; }
    return false;
  }

  function enhance() {
    if (busy || typeof S === 'undefined') return;
    // Erst handeln, wenn die App wirklich gerendert hat — vorher ist DB noch
    // nicht aus dem Speicher geladen und ein Schreibzugriff würde ihn leeren.
    if (!screen.firstElementChild) return;
    busy = true;
    try {
      if (S.view === 'home') { if (firstRunJump()) { busy = false; return; } enhanceHome(); }
      else if (S.view === 'training' && S.mesoIdx == null) enhanceMesoList();
      else if (S.view === 'training' && S.mesoIdx === KI) enhanceDetail();
      else if (S.view === 'guide') enhanceGuide();
    } catch (err) { console.warn('[Knie-Block]', err); }
    busy = false;
  }

  new MutationObserver(enhance).observe(screen, { childList: true });
  enhance();
  setTimeout(enhance, 0);

  screen.addEventListener('input', function (e) {
    const t = e.target;
    const f = t.getAttribute && t.getAttribute('data-knee');
    if (!f) return;
    if (f === 'date') {
      selDate = t.value || today();
      const p = screen.querySelector('#knee-panel');
      if (p) p.outerHTML = panelHTML();
      return;
    }
    const st = store();
    st[selDate] = st[selDate] || {};
    st[selDate][f] = (f === 'n') ? t.value : clamp10(t.value);
    persist();
    const h = screen.querySelector('#knee-hist');
    if (h) h.innerHTML = histHTML();
  });
})();
</script>
<!-- ==========================================================================
     MAKROZYKLUS-2 ADD-ON  ·  Sehne → Power  ·  v1.0  (2026-10-20)

     EINFÜGEN:  diesen ganzen Block ans Ende der App setzen, direkt vor dem
                schließenden body-Tag — NACH dem Knie-Block-Add-on.
                MZ1 (M1–M6 und Knie-Block) bleibt unverändert.

     ENTFERNEN: Block wieder löschen. Deine MZ2-Daten bleiben im Speicher
                (vb_training, vb_settings.mz2) und sind im Backup enthalten.

     WAS ES MACHT:
       · Makrozyklus 2 nach M6: 8 Mesozyklen à 3 Wochen (A, B1–B3, C1–C3, D)
       · die ersten 13 Wochen in der Saison (Halle + Spiel), danach
         Off-Season mit Sprung-Session am Samstag (Timer)
       · Knie-Ampel aus Morgen-Check und Trainingsschmerz, 21-Tage-Verlauf
       · Übergänge A→B, B→C und kurze Kontakte, "Mesozyklus wiederholen"
       · Tests (Standsprung, Reach, VISA-P, 3RM → 1RM) im Sprung-Tab
       · Wochenplan mit Warnungen, Guide-Abschnitt, Hinweis in M5/M6
     ========================================================================== -->
<style>
#knee-banner{display:none !important}
.mz-macro{margin-bottom:15px}
.mz-macro button{font-size:13px;letter-spacing:.04em;padding:9px 2px}
.mz-amp{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-disp);font-size:13px;letter-spacing:.06em;padding:5px 11px;border-radius:9px;color:#0c0d11;text-transform:uppercase;line-height:1.15}
.mz-amp.green{background:var(--good)}
.mz-amp.yellow{background:#fbbf24}
.mz-amp.red{background:var(--bad)}

  /* ---------- Kalender ---------- */
  function seq() {
    const rep = cfg().rep || {};
    const out = [];
    ORDER.forEach(code => {
      const n = 1 + Math.max(0, Math.min(5, rep[code] | 0));
      for (let o = 0; o < n; o++) out.push({ code: code, occ: o, ns: o ? code + '~' + o : code });
    });
    return out;
  }
  function startD() {
    const s = parseD(cfg().start);
    if (s) return s;
    const sd = parseD(DB.settings && DB.settings.startDate);
    if (sd) return addD(sd, 168);
    const t = today();
    return addD(t, ((8 - t.getDay()) % 7) || 7);
  }
  // Saisonende = letzter Tag der Saison (inklusive); Standard: 13 Wochen nach dem Start
  const seasonEndD = () => parseD(cfg().seasonEnd) || addD(startD(), 90);
  const inSeason = ws => ws <= seasonEndD();
  const weekStartOf = (i, wi) => addD(startD(), (i * 3 + wi) * 7);
  const dayDate = (ws, dk) => addD(ws, ((cfg().sched[dk] - ws.getDay()) + 7) % 7);
  function pos(d) {
    const st = startD(), sq = seq(), total = sq.length * 3;
    const days = diffD(d, st);
    if (days < 0) return { state: 'pre', days: -days, total: total, start: st };
    const wk = Math.floor(days / 7);
    if (wk >= total) return { state: 'done', total: total, start: st, wk: total - 1 };
    const i = Math.floor(wk / 3), wi = wk % 3;
    return { state: 'run', wk: wk, i: i, wi: wi, total: total, start: st, meso: sq[i], weekStart: addD(st, wk * 7) };
  }
  const weekLabels = code => MZ[code].wl || ['Aufbau', 'Aufbau+', 'Entlastung'];

  /* ---------- Knie-Ampel ---------- */
  const AC = new Map();
  const acClear = () => AC.clear();
  function mval(ds) {
    const v = kneeStore()[ds];
    if (!v) return null;
    const l = num(v.l), r = num(v.r);
    if (l == null && r == null) return null;
    return Math.max(l == null ? 0 : l, r == null ? 0 : r);
  }
  function sval(ds) {
    const v = cfg().sess[ds];
    if (!v) return null;
    const p = num(v.p);
    if (p == null && !v.warm) return null;
    return { p: p, warm: v.warm || '' };
  }
  function normalFor(d) {
    const w = [];
    for (let i = 3; i <= 16; i++) { const v = mval(isoD(addD(d, -i))); if (v != null) w.push(v); }
    if (w.length >= 3) {
      w.sort((a, b) => a - b);
      const m = w.length >> 1;
      return w.length % 2 ? w[m] : (w[m - 1] + w[m]) / 2;
    }
    const all = [];
    for (let i = 1; i <= 60; i++) { const v = mval(isoD(addD(d, -i))); if (v != null) all.push(v); }
    return all.length ? Math.min.apply(null, all) : 2;
  }
  function dayStatus(d) {
    const ds = isoD(d);
    if (AC.has(ds)) return AC.get(ds);
    const m = mval(ds), s = sval(ds);
    let r;
    if (m == null && !s) r = { st: 'none', why: [], m: null, s: null, nrm: null };
    else {
      const nrm = normalFor(d), why = [];
      let st = 'green';
      if (s && s.p != null && s.p >= 4) { st = 'red'; why.push('Schmerz ' + fmtN(s.p) + '/10 im Training'); }
      if (m != null && m >= nrm + 2) {
        const m1 = mval(isoD(addD(d, -1))), m2 = mval(isoD(addD(d, -2)));
        if (m1 != null && m2 != null && m1 >= nrm + 2 && m2 >= nrm + 2) { st = 'red'; why.push('Morgenwert seit über 48 h mindestens 2 über normal'); }
      }
      if (st !== 'red') {
        if (s && s.p != null && s.p >= 3) { st = 'yellow'; why.push('Schmerz ' + fmtN(s.p) + '/10 im Training'); }
        if (s && s.warm === 'no') { st = 'yellow'; why.push('Aufwärmen wurde nicht besser'); }
        if (m != null && m >= nrm + 1) { st = 'yellow'; why.push('Morgenwert ' + fmtN(m) + ' über deinem Normalwert ' + fmtN(nrm)); }
        else if (m != null && m >= 5) { st = 'yellow'; why.push('Morgenwert ' + fmtN(m) + ' ist hoch — mit Arzt oder Physio abklären'); }
      }
      if (st === 'green') {
        const tr = s && s.p != null ? 'Training ' + fmtN(s.p) + '/10' : (s && s.warm === 'ok' ? 'Aufwärmen besser oder schmerzfrei' : '');
        why.push(m != null ? 'Morgenwert ' + fmtN(m) + ' im Normalbereich' + (tr ? ', ' + tr : '') : tr);
      }
      r = { st: st, why: why, m: m, s: s, nrm: nrm };
    }
    AC.set(ds, r);
    return r;
  }
  function ampelNow() {
    const t = today();
    const r = dayStatus(t);
    if (r.st !== 'none') return Object.assign({ from: 'heute' }, r);
    const y = dayStatus(addD(t, -1));
    if (y.st !== 'none') return Object.assign({ from: 'gestern' }, y);
    return Object.assign({ from: '' }, r);

    const keys = Object.keys(c.sess).filter(k => k <= isoD(t) && num(c.sess[k].p) != null).sort().slice(-3);
    const ps = keys.map(k => num(c.sess[k].p));
    const items = [
      { ok: n >= 5 && mx <= 2, t: 'Sieben Tage Morgen-Check bis 2', d: n + ' von 7 Tagen eingetragen' + (n ? ' · höchster Wert ' + fmtN(mx) : '') },
      { ok: ps.length > 0 && Math.max.apply(null, ps) <= 2, t: 'Heavy-Slow und Training bis 2/10', d: ps.length ? 'letzte ' + ps.length + ' Einheiten: ' + ps.map(fmtN).join(' · ') : 'noch kein Trainingsschmerz eingetragen' },
      { ok: !!c.gates.g1x, t: 'Keine Reaktion über 48 h nach Halle oder Spiel', d: 'selbst bestätigen', chk: 'g1x' }

  function gateG2() {

        if (hit) weeks++;

    });
    let red = 0;
    for (let i = 0; i < 21; i++) if (dayStatus(addD(today(), -i)).st === 'red') red++;
    const g = c.gates;
    const sl = num(g.slds_l), sr = num(g.slds_r), el = num(g.ext_l), er = num(g.ext_r);
    const diff = (el != null && er != null && Math.max(el, er) > 0) ? Math.abs(el - er) / Math.max(el, er) * 100 : null;
    const items = [
      { ok: weeks >= 8, t: 'Neun Wochen Heavy-Slow absolviert', d: weeks + ' von 9 Wochen mit Kniebeuge an Tag A abgehakt (8 reichen)' },

    ];

  function gateG3(d) {
    let bad = 0, data = 0;
    for (let i = 0; i < 21; i++) {

  function dayItems(code, wi, dk, evalD) {

    let g3 = null;
    return raw.map(sp => {
      let id = sp.id, L = LIB[id], altOf = null;
      if (L.gate === 'g3') {
        if (g3 == null) g3 = gateG3(evalD || today()).ok;
        if (!g3) { altOf = id; id = L.alt; L = LIB[id]; }
      }
      let sets = sp.sets;
      const pct = Array.isArray(sp.pct) ? sp.pct[Math.min(wi, 1)] : sp.pct;
      if (!M.weeks && wi === 2) {
        if (L.k === 'iso') sets = Math.max(2, sets - 1);
        else if (L.k !== 'test' && L.k !== 'timer') sets = Math.max(1, Math.round(sets * 0.6));
      }
      return {
        k: id, id: id, L: L, altOf: altOf, sets: sets, reps: sp.reps, pct: pct,
        n: altOf ? L.n : (sp.n || L.n), c: altOf ? L.c : (sp.c || L.c), tempo: sp.tempo != null ? sp.tempo : L.tempo,
        minutes: sp.min ? sp.min[wi] : null

    });

      if (it.L.k === 'plyo') { const n = it.sets * (parseInt(it.reps, 10) || 0); all += n; if (it.L.hi) hi += n; }
      else if (it.id === 'sjtest') test += it.sets;

    return { all: all, hi: hi, test: test };

  /* ---------- Training: Detail ---------- */
  function lastFor(exK, curOrd) {
    let best = null;
    const sq = seq();
    const idx = {};
    sq.forEach((m, i) => { idx[m.ns] = i; });
    Object.keys(DB.training.log).forEach(k => {
      if (k.indexOf('z2:') !== 0) return;
      const pt = k.split(':');
      if (pt.length !== 6 || pt[4] !== exK || idx[pt[1]] == null) return;
      const ord = idx[pt[1]] * 3 + (+pt[3]);
      if (ord >= curOrd) return;
      const lg = DB.training.log[k] || {}, kg = num(lg.kg);
      if (kg == null) return;
      if (!best || ord > best.ord || (ord === best.ord && kg > best.kg)) best = { ord: ord, kg: kg, reps: lg.reps, ns: pt[1], wi: +pt[3] };
    });
    return best;
  }
  function e1rm(kg, reps) { return reps <= 1 ? kg : kg * (1 + reps / 30); }
  function summary(it, lg) {
    lg = lg || {};
    const k = it.L.k;
    if (k === 'test') return lg.cm ? E(lg.cm) + ' cm' : '';
    if (k === 'timer') return [lg.jumps ? E(lg.jumps) + ' Sprünge' : '', lg.pain ? 'Schmerz ' + E(lg.pain) : ''].filter(Boolean).join(' · ');
    if (k === 'iso') return [lg.kg ? E(lg.kg) + ' kg' : '', lg.sec ? E(lg.sec) + ' s' : '', lg.pain ? 'Schmerz ' + E(lg.pain) : ''].filter(Boolean).join(' · ');
    const parts = [lg.kg ? E(lg.kg) + ' kg' : '', lg.reps ? '× ' + E(lg.reps) : '', lg.rpe ? 'RPE ' + E(lg.rpe) : '', (k === 'hold' && lg.pain) ? 'Schmerz ' + E(lg.pain) : ''].filter(Boolean);
    let h = parts.join(' ');
    const kg = num(lg.kg), reps = num(lg.reps);
    if (it.L.test && it.L.lift && kg && reps && reps >= 1 && reps <= 10) {
      const v = Math.round(e1rm(kg, reps) * 2) / 2;
      const cur = DB.onerm[it.L.lift];
      const same = cur != null && Math.abs(cur - v) < 0.01;
      h += ' · e1RM ' + fmtN(v) + ' <button class="mz-rmbtn" data-mzrm="' + it.L.lift + ':' + v + '"' + (same ? ' disabled' : '') + '>' + (same ? '✓ ist 1RM' : '→ als 1RM') + '</button>';
    }
    return h;
  }
  function setsHTML(it, kbase, col, ph) {
    const k = it.L.k;
    let h = '';
    const inline = k === 'plyo' || k === 'bw';
    for (let s = 0; s < it.sets; s++) {
      const key = kbase + ':' + s, on = !!DB.training.done[key], lg = DB.training.log[key] || {};
      const box = '<button class="setbox ' + (on ? 'done' : '') + '" data-mzset="' + it.k + ':' + s + '" style="' + (on ? 'background:' + col : '') + '">' + (s + 1) + '</button>';
      if (inline) { h += box; continue; }
      const fl = FIELDS[k] || FIELDS.lift;
      h += '<div class="set-item"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">' + box
        + '<span class="mz-ls" id="mzls-' + it.k + '-' + s + '">' + summary(it, lg) + '</span></div>'
        + '<div class="set-log-panel" id="mzp-' + it.k + '-' + s + '"><div class="slp-header">' + (k === 'test' ? 'Versuch ' : 'Satz ') + (s + 1) + '</div>'
        + '<div class="slp-grid" style="grid-template-columns:repeat(' + fl.length + ',1fr)">'
        + fl.map(f => '<div><label>' + f[1] + '</label><input type="number" inputmode="' + f[2] + '" data-mzlog="' + it.k + ':' + s + ':' + f[0] + '" value="' + E(lg[f[0]] || '') + '" placeholder="' + E((f[0] === 'kg' && ph) ? ph : ((f[0] === 'reps' || f[0] === 'sec') ? String(it.reps).replace(/\s.*$/, '') : '–')) + '"></div>').join('')
        + '</div></div></div>';

  const mmss = ms => { const s = Math.ceil(Math.max(0, ms) / 1000); return p2(Math.floor(s / 60)) + ':' + p2(s % 60); };
  function paintTimer() {

      clearInterval(TIMER.iv); TIMER.iv = null;

    const lastH = last ? '<div class="mz-last">Zuletzt (' + E(last.ns + ' W' + (last.wi + 1)) + '): <b>' + fmtN(last.kg) + ' kg' + (last.reps ? ' × ' + E(last.reps) : '') + '</b></div>' : '';
    let body;
    if (L.k === 'timer') {
      const key = kbase + ':0';
      const ms = (it.minutes || 0) * 60000;
      if (!TIMER.run && TIMER.key !== key) { TIMER.key = key; TIMER.total = ms; TIMER.left = ms; }

      body = '<div class="mz-timer"><div class="mz-tv' + (showLeft <= 0 ? ' end' : '') + '" id="mz-tv">' + mmss(showLeft) + '</div>'
        + '<div class="mz-tb"><button class="btn" id="mz-tgo" data-mztimer="' + (TIMER.run && TIMER.key === key ? 'pause' : 'start') + '">' + (TIMER.run && TIMER.key === key ? 'Pause' : (showLeft <= 0 ? 'Fertig' : 'Start')) + '</button>'
        + '<button class="btn ghost" data-mztimer="reset">Reset</button></div></div>'
        + '<div class="cues">' + E(it.c) + '</div>'
        + setsHTML(it, kbase, ctx.col, null);
    } else {
      body = lastH + '<div class="cues">' + E(it.c) + '</div>' + setsHTML(it, kbase, ctx.col, kg != null ? fmtN(kg) : (last ? fmtN(last.kg) : null));

    return '<div class="ex' + (dim ? ' mz-dim' : '') + '" style="--cat:' + cat + '">'

  function progCounts() {
    if (!CTX) return { total: 0, done: 0 };

    CTX.items.forEach(it => {
      for (let s = 0; s < it.sets; s++) { total++; if (DB.training.done['z2:' + CTX.ns + ':' + CTX.dk + ':' + CTX.wi + ':' + it.k + ':' + s]) done++; }

  }

    const all = [];
    series.forEach(s => s.vals.forEach(v => { if (v != null) all.push(v); }));
    if (!all.length) return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="mz-spark"><text x="' + W / 2 + '" y="' + H / 2 + '" text-anchor="middle" fill="#6b7280" font-size="13" font-weight="600" font-family="Manrope,sans-serif">Noch keine MZ2-Testwerte</text></svg>';
    let mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
    if (mn === mx) { mn -= 5; mx += 5; }
    mn = Math.floor(mn - 2); mx = Math.ceil(mx + 2);
    const X = i => pl + (W - pl - pr) * (n < 2 ? 0.5 : i / (n - 1));
    const Y = v => pt + (H - pt - pb) * (1 - (v - mn) / (mx - mn));
    let g = '';
    for (let k = 0; k <= 2; k++) {
      const v = mn + (mx - mn) * k / 2, y = Y(v).toFixed(1);
      g += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '" stroke="rgba(255,255,255,.07)"/>'
        + '<text x="' + (pl - 5) + '" y="' + (+y + 3) + '" text-anchor="end" fill="#6b7280" font-size="9" font-weight="600" font-family="Manrope,sans-serif">' + Math.round(v) + '</text>';
    }
    labels.forEach((l, i) => { g += '<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" fill="#6b7280" font-size="8.5" font-weight="700" font-family="Manrope,sans-serif">' + E(l) + '</text>'; });
    series.forEach(s => {
      const pts = [];
      s.vals.forEach((v, i) => { if (v != null) pts.push([X(i).toFixed(1), Y(v).toFixed(1)]); });
      if (pts.length >= 2) g += '<polyline fill="none" stroke="' + s.col + '" stroke-width="2.4" stroke-linejoin="round" points="' + pts.map(q => q.join(',')).join(' ') + '"/>';
      pts.forEach(q => { g += '<circle cx="' + q[0] + '" cy="' + q[1] + '" r="3.6" fill="' + s.col + '"/><circle cx="' + q[0] + '" cy="' + q[1] + '" r="1.5" fill="#0c0d11"/>'; });
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="mz-spark" role="img" aria-label="Verlauf Standsprung und Reach">' + g + '</svg>';
  }

  function syncTest(ns, exK, field) {
    const pre = 'z2:' + ns + ':';
    let best = null;
    Object.keys(DB.training.log).forEach(k => {
      if (k.indexOf(pre) !== 0) return;
      const pt = k.split(':');
      if (pt[4] !== exK) return;
      const v = num((DB.training.log[k] || {}).cm);
      if (v != null && (best == null || v > best)) best = v;
    });
    if (best == null) return;
    const T = cfg().tests;
    T[ns] = T[ns] || {};
    T[ns][field] = String(best);
    if (!T[ns].date) T[ns].date = isoD(today());
    persist();
  }

  screen.addEventListener('click', ev => {
    const t = ev.target;
    let b;
    if ((b = t.closest('[data-mzmacro]'))) { MZS.macro = b.dataset.mzmacro; S.mesoIdx = null; MZS.mi = null; render(); return; }
    if ((b = t.closest('[data-mzgate]'))) { ev.preventDefault(); ev.stopPropagation(); gateAction(b.dataset.mzgate); return; }
    if ((b = t.closest('[data-mzopen]'))) {
      const a = b.dataset.mzopen.split(':');
      openMZ(+a[0], a[1] != null && a[1] !== '' ? +a[1] : null, a[2] || null);
      return;
    }
    if ((b = t.closest('[data-mzgo]'))) {
      if (b.dataset.mzgo === 'list') { S.view = 'training'; S.mesoIdx = null; MZS.macro = 'mz2'; MZS.mi = null; render(); }
      return;
    }
    if ((b = t.closest('[data-mzback]'))) { MZS.mi = null; render(); return; }
    if ((b = t.closest('[data-mzweek]'))) { MZS.wi = +b.dataset.mzweek; render(); return; }
    if ((b = t.closest('[data-mzday]'))) { MZS.di = b.dataset.mzday; render(); return; }
    if ((b = t.closest('[data-mzrm]'))) {
      const a = b.dataset.mzrm.split(':'), v = +a[1];
      if (a[0] && v > 0) {
        DB.onerm[a[0]] = v; saveKey('vb_onerm', DB.onerm);
        b.textContent = '✓ ist 1RM'; b.disabled = true;
      }
      return;
    }
    if ((b = t.closest('[data-mzset]'))) { toggleSet(b); return; }
    if ((b = t.closest('[data-mzwarm]'))) {
      const box = b.closest('[data-mzkd]');
      if (!box) return;
      const ds = box.dataset.mzkd, s = cfg().sess, v = b.dataset.mzwarm;
      s[ds] = s[ds] || {};
      s[ds].warm = s[ds].warm === v ? '' : v;
      if (!s[ds].warm && (s[ds].p == null || s[ds].p === '')) delete s[ds];
      persist();
      box.querySelectorAll('[data-mzwarm]').forEach(x => x.classList.toggle('on', !!s[ds] && x.dataset.mzwarm === s[ds].warm));
      refreshKneeLive();
      return;
    }
    if ((b = t.closest('[data-mzsch]'))) {
      const a = b.dataset.mzsch.split(':'), key = a[0], d = +a[1], c = cfg();
      if (key === 'hall') { const k = c.hall.indexOf(d); if (k >= 0) c.hall.splice(k, 1); else c.hall.push(d); }
      else if (key === 'match') c.match = c.match === d ? null : d;
      else c.sched[key] = d;
      persist();
      const card = document.getElementById('mz-sched');
      if (card) card.outerHTML = schedCardHTML();
      return;
    }
    if ((b = t.closest('[data-mztimer]'))) {
      const a = b.dataset.mztimer;
      if (a === 'start') {
        if (TIMER.left <= 0) return;
        TIMER.run = true; TIMER.endAt = Date.now() + TIMER.left;
        clearInterval(TIMER.iv); TIMER.iv = setInterval(timerTick, 250);
      } else if (a === 'pause') {
        TIMER.run = false; TIMER.left = Math.max(0, TIMER.endAt - Date.now());
        clearInterval(TIMER.iv); TIMER.iv = null;
      } else if (a === 'reset') {
        TIMER.run = false; clearInterval(TIMER.iv); TIMER.iv = null; TIMER.left = TIMER.total;

  function toggleSet(btn) {

    if (now) DB.training.done[k] = true; else delete DB.training.done[k];

        panel.classList.add('open'); btn.classList.add('active-log');

  function gateAction(cmd) {
    const a = cmd.split(':'), op = a[0], arg = a[1], c = cfg();
    if (op === 'confirm') c.gates[arg] = isoD(today());
    else if (op === 'unconfirm') delete c.gates[arg];
    else if (op === 'repeat') {
      if (!window.confirm(arg + ' wiederholen? Der Plan verschiebt sich um 3 Wochen, deine bisherigen Einträge bleiben erhalten.')) return;
      c.rep[arg] = Math.min(5, (c.rep[arg] | 0) + 1);
      const p = pos(today());
      if (MZS.mi != null && p.state === 'run') { MZS.mi = p.i; MZS.wi = p.wi; MZS.di = null; }
    } else if (op === 'undo') {
      c.rep[arg] = Math.max(0, (c.rep[arg] | 0) - 1);
      if (!c.rep[arg]) delete c.rep[arg];
    }
    persist();
    keepScroll(render);
  }

    if (d.mzk && d.mzk !== 'date') {
      const box = t.closest('[data-mzkd]'), ds = box ? box.dataset.mzkd : isoD(today());
      const clamp = v => { const n = num(v); return n == null ? '' : String(Math.max(0, Math.min(10, n))); };
      if (d.mzk === 'p') {
        const s = cfg().sess;
        s[ds] = s[ds] || {};
        s[ds].p = clamp(t.value);
        if (s[ds].p === '' && !s[ds].warm) delete s[ds];
        persist();
      } else {
        const st = kneeStore();
        st[ds] = st[ds] || {};
        st[ds][d.mzk] = d.mzk === 'n' ? t.value : clamp(t.value);
        persist();
      }
      refreshKneeLive();
      return;
    }
    if (d.mzgin) {
      cfg().gates[d.mzgin] = t.value;
      persist();
      acClear();
      const card = t.closest('.mz-gate');
      if (!card) return;
      const tmp = document.createElement('div');
      tmp.innerHTML = gateCardHTML(card.id.replace('mz-gate-', ''), { repCode: card.dataset.rep || null });
      const fresh = tmp.firstElementChild, nlis = fresh.querySelectorAll('li');
      card.querySelectorAll('li').forEach((li, idx) => {
        const nl = nlis[idx];
        if (!nl) return;
        const ic = li.querySelector('.ic'), nic = nl.querySelector('.ic');
        if (ic && nic) { ic.className = nic.className; ic.textContent = nic.textContent; }
        const sm = li.querySelector('small'), nsm = nl.querySelector('small');
        if (sm && nsm) sm.textContent = nsm.textContent;
      });
      const tag = card.querySelector('.tag'), ntag = fresh.querySelector('.tag');
      if (tag && ntag) { tag.textContent = ntag.textContent; tag.style.background = ntag.style.background; }
      card.style.borderLeftColor = fresh.style.borderLeftColor;
      const cb = card.querySelector('[data-mzgate^="confirm"]'), ncb = fresh.querySelector('[data-mzgate^="confirm"]');
      if (cb && ncb) cb.className = ncb.className;
      return;
    }
    if (d.mzt) {
      const a = d.mzt.split(':'), ns = a[0], f = a[1], T = cfg().tests;
      T[ns] = T[ns] || {};
      T[ns][f] = t.value;
      persist();
      return;
    }
  });
  screen.addEventListener('change', ev => {
    const t = ev.target, d = t.dataset || {};
    if (d.mzk === 'date') {
      KSEL = t.value || isoD(today());
      const card = document.getElementById('mz-knee');
      if (card) card.outerHTML = kneeCardInner();
      return;
    }
    if (d.mzcfg) {
      cfg()[d.mzcfg] = t.value || '';
      if (!t.value) delete cfg()[d.mzcfg];
      persist();
      keepScroll(render);
      return;
    }
    if (d.mzgchk) {
      cfg().gates[d.mzgchk] = !!t.checked;
      persist();
      keepScroll(render);
      return;
    }
    if (d.mzt && (d.mzt.split(':')[1] === 'sj' || d.mzt.split(':')[1] === 'reach')) {
      const sec = document.getElementById('mz-jump');
      if (sec) keepScroll(() => { sec.outerHTML = jumpSectionHTML(); });
    }
  });

  /* ---------- Start ---------- */
  render();
})();
</script>
</body>
</html>
